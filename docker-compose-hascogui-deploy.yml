version: '3'

services:
  drupal:
    build:
      context: ./hascogui
      dockerfile: Dockerfile-deploy
      args:
        BRANCH: ${BRANCH}
    container_name: drupal
    ports:
      - "80:80"
      - "443:443"      
    volumes:
      - drupal-data:/opt/drupal/web
      - /var/keys/simple_oauth:/var/keys/simple_oauth
      - ${MODULES_FILE:-/var/data/hascorepo/modules.json}:/opt/drupal/modules.json:ro
    environment:
      DB_HOST: db
      DB_NAME: drupal
      DB_USER: drupal
      DB_PASS: drupal
      DOCKER_COMPOSE_FILE: docker-compose-hascogui-deploy.yml
      MODULES_FILE: ${MODULES_FILE:-/opt/drupal/modules.json}
    depends_on:
      - db
    networks:
      hascoapi:
        aliases:
          - drupal
    command: ["apache2-foreground"]

  db:
    image: uselagoon/mariadb-10.6-drupal:22.2.0
    container_name: drupal_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
    volumes:
      - db-data:/var/lib/mysql
    networks:
      hascoapi:
        aliases:
          - db

volumes:
  drupal-data:
  db-data:

networks:
  hascoapi:
